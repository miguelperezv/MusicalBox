{# Clima del tema: cae POR ENCIMA de todo (carátula incluida), como si miráramos por la
   ventana. Va en su propio <svg> después de las portadas, en el mismo sistema de
   coordenadas del logotipo y con el mismo desplazamiento (left: 8%), así que las piezas
   caen alineadas con el vinilo. Ver .mb-hero-art .mb-clima en app.css.

   Sólo Navidad (nieve) y Amor y amistad (lluvia de corazones) usan esta capa. #}

<svg class="mb-clima" viewBox="200 200 1600 1600" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    {% set nieve = [(300, 220, 26, 8, 0.0, 14), (620, 700, 20, -6, 3.5, 15), (900, 1250, 30, 10, 7.0, 13),
                    (1180, 1700, 22, 0, 10.5, 16), (1450, 400, 26, 12, 1.2, 14), (1700, 1500, 32, -8, 5.0, 13.5),
                    (420, 950, 20, 6, 8.6, 15.5), (780, 1800, 28, -12, 12.0, 14), (1050, 300, 24, 4, 2.4, 13),
                    (1320, 1100, 30, -4, 6.2, 16), (1600, 600, 22, 9, 9.8, 14.5), (520, 1600, 26, -9, 13.1, 15),
                    (1000, 850, 20, 5, 4.3, 13.5), (1750, 1300, 28, -5, 11.4, 14.5), (760, 1400, 24, 7, 0.7, 14),
                    (1380, 900, 20, -11, 4.9, 15), (1120, 1500, 26, 3, 8.2, 13), (1620, 1000, 22, -7, 11.9, 16),

                    (1500, 1750, 24, -10, 2.0, 14)] %}
    {% for (x, y, r, g, ret, dur) in nieve %}{{ copo(x, y, r, g, ret, dur, 'mb-tema-cae') }}{% endfor %}
</svg>
