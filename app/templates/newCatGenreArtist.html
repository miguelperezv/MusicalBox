{% from "_macros.html" import field %}
<h1 class="h3 mb-4">Género, categoría y artista</h1>
<div class="row g-4">
    <div class="col-xl-4 col-md-6">
        <form class="mb-panel h-100" method="POST" action="{{ url_for('dashboard.newartist') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <h2 class="h6 mb-3"><i class="bi bi-mic me-2 text-primary"></i>Nuevo artista</h2>
            {{ field(form.n_artist) }}
            {{ field(form.country) }}
            <button type="submit" class="btn btn-primary btn-sm">Agregar artista</button>
        </form>
    </div>
    <div class="col-xl-4 col-md-6">
        <form class="mb-panel h-100" method="POST" action="{{ url_for('dashboard.newgenre') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <h2 class="h6 mb-3"><i class="bi bi-music-note-beamed me-2 text-primary"></i>Nuevo género</h2>
            {{ field(form.genre, placeholder='Ej: INDIE POP') }}
            <button type="submit" class="btn btn-primary btn-sm">Agregar género</button>
        </form>
    </div>
    <div class="col-xl-4 col-md-6">
        <form class="mb-panel h-100" method="POST" action="{{ url_for('dashboard.newcategory') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <h2 class="h6 mb-3"><i class="bi bi-tag me-2 text-primary"></i>Nueva categoría</h2>
            {{ field(form.category, placeholder='Ej: CASSETTE') }}
            <button type="submit" class="btn btn-primary btn-sm">Agregar categoría</button>
        </form>
    </div>
</div>
