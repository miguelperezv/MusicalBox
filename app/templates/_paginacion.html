{% macro paginacion(p) %}
{% if p and p.pages > 1 %}
<nav class="mt-3" aria-label="Paginación">
    <ul class="pagination pagination-sm justify-content-center mb-0">
        <li class="page-item {{ 'disabled' if p.page <= 1 }}">
            <a class="page-link" href="{{ p.prev }}" data-load="{{ p.prev }}" aria-label="Página anterior">‹</a>
        </li>
        {% for n, u in p.urls %}
            {% if u %}
            <li class="page-item {{ 'active' if n == p.page }}"><a class="page-link" href="{{ u }}" data-load="{{ u }}">{{ n }}</a></li>
            {% else %}
            <li class="page-item disabled"><span class="page-link">…</span></li>
            {% endif %}
        {% endfor %}
        <li class="page-item {{ 'disabled' if p.page >= p.pages }}">
            <a class="page-link" href="{{ p.next }}" data-load="{{ p.next }}" aria-label="Página siguiente">›</a>
        </li>
    </ul>
</nav>
{% endif %}
{% endmacro %}
