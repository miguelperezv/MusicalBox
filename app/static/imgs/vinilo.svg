<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-hidden="true">
  <!-- Vinilo de marca Musical Box: cuerpo amarillo, surcos turquesa, etiqueta turquesa y puntito celeste.
       Los surcos son arcos asimetricos, por eso al girar SE NOTA el movimiento. -->
  <defs>
    <clipPath id="mbDisc"><circle cx="100" cy="100" r="98"/></clipPath>
  </defs>

  <!-- cuerpo amarillo -->
  <circle cx="100" cy="100" r="98" fill="#fffb25"/>

  <!-- surcos turquesa (arcos con puntas redondeadas) -->
  <g fill="none" stroke="#3ab7cd" stroke-linecap="round" clip-path="url(#mbDisc)">
    <circle cx="100" cy="100" r="80" stroke-width="9" stroke-dasharray="175 328" transform="rotate(18 100 100)"/>
    <circle cx="100" cy="100" r="66" stroke-width="8" stroke-dasharray="55 360" transform="rotate(200 100 100)"/>
    <circle cx="100" cy="100" r="55" stroke-width="7" stroke-dasharray="42 304" transform="rotate(206 100 100)"/>
    <circle cx="100" cy="100" r="66" stroke-width="8" stroke-dasharray="55 360" transform="rotate(330 100 100)"/>
    <circle cx="100" cy="100" r="55" stroke-width="7" stroke-dasharray="42 304" transform="rotate(336 100 100)"/>
  </g>

  <!-- etiqueta central turquesa + puntito celeste -->
  <circle cx="100" cy="100" r="40" fill="#3ab7cd"/>
  <circle cx="100" cy="100" r="7" fill="#92d4ff"/>
</svg>
